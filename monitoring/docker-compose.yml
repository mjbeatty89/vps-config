# Monitoring stack for the VPS gateway (Prometheus + Grafana + exporters)
# Project: monitoring  |  all UIs bind to 127.0.0.1, Caddy terminates TLS
#
# Start:  cd monitoring && docker compose up -d
# Deps:   .env (gitignored) provides GRAFANA_ADMIN_PASSWORD + Telegram creds
name: monitoring

networks:
  monitoring:
    name: monitoring

services:

  # ── Metrics database ───────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - /opt/docker/monitoring/prometheus/data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [monitoring]

  # ── Dashboards ─────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://grafana.aadd.rocks}
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-grafana.aadd.rocks}
      # Consumed by provisioning/alerting/contactpoints.yml
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_API}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    volumes:
      - /opt/docker/monitoring/grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3002:3000"
    networks: [monitoring]
    depends_on: [prometheus]

  # ── Host metrics ───────────────────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker/.+)($|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]

  # ── Container metrics ──────────────────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [monitoring]

  # ── Blackbox probes (HTTP + ICMP) ──────────────────────────────────────────
  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    cap_add:
      - NET_RAW
    sysctls:
      net.ipv4.ping_group_range: "0 65535"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    ports:
      - "127.0.0.1:9115:9115"
    networks: [monitoring]

  # ── UniFi controller metrics (enable with: --profile unifi) ────────────────
  unpoller:
    image: ghcr.io/unpoller/unpoller:latest
    container_name: unpoller
    restart: unless-stopped
    profiles: [unifi]
    environment:
      UP_PROMETHEUS_HTTP_LISTEN: 0.0.0.0:9130
      UP_PROMETHEUS_NAMESPACE: unifi
      UP_UNIFI_DYNAMIC: "false"
      UP_UNIFI_DEFAULT_URL: ${UNIFI_URL:-}
      UP_UNIFI_DEFAULT_USER: ${UNIFI_USER:-}
      UP_UNIFI_DEFAULT_PASS: ${UNIFI_PASSWORD:-}
      UP_UNIFI_DEFAULT_VERIFY_SSL: ${UNIFI_VERIFY_SSL:-false}
      UP_UNIFI_DEFAULT_SAVE_SITES: "true"
      UP_UNIFI_DEFAULT_SAVE_DPI: "true"
    ports:
      - "127.0.0.1:9130:9130"
    networks: [monitoring]

  # ── Service dashboard (links + live status) ────────────────────────────────
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-home.aadd.rocks}
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:3010:3000"
    networks: [monitoring]
