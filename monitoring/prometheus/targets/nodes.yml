# Prometheus file_sd targets: node-exporter on the Pi nodes (job: pi-node)
# MagicDNS names resolve over the tailnet. Edit + `curl -X POST :9090/-/reload`.
- targets:
    - "dnspi.manee-frog.ts.net:9100"
    - "dockernodepi.manee-frog.ts.net:9100"
  labels:
    site: home
    role: pi

- targets:
    - "100.87.215.43:9100"   # pve
    - "100.66.106.75:9100"   # pvevcm
  labels:
    site: home
    role: proxmox

- targets:
    - "10.1.30.14:9100"      # PBS
  labels:
    site: home
    role: pbs
