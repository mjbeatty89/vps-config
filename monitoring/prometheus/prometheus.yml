global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    host: oracle-vps
    site: aadd

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host metrics for the VPS (via node_exporter sidecar)
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Per-container metrics
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # UniFi metrics are not scraped until an unpoller container is deployed.

  # ── Raspberry Pi nodes (file-based service discovery) ─────────────────────
  - job_name: pi-node
    file_sd_configs:
      - files: ["/etc/prometheus/targets/nodes.yml"]

  - job_name: pi-cadvisor
    file_sd_configs:
      - files: ["/etc/prometheus/targets/cadvisor.yml"]

  # ── Proxmox VE (pve-exporter) ─────────────────────────────────────────────
  - job_name: pve
    scrape_interval: 2m
    scrape_timeout: 30s
    metrics_path: /pve
    params:
      module: [pve]
    static_configs:
      - targets: ["10.1.30.13"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221

  - job_name: pvevcm
    scrape_interval: 2m
    scrape_timeout: 30s
    metrics_path: /pve
    params:
      module: [pvevcm]
    static_configs:
      - targets: ["10.1.30.15"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221

  # ── Scraparr (*arr exporter on Unraid) ────────────────────────────────────
  # Exporter runs on the Unraid arr host and is scraped over Tailscale.
  # Default Scraparr port is 7100; change the target if the container maps it.
  - job_name: scraparr
    authorization:
      type: Bearer
      credentials_file: /run/secrets/scraparr-token
    scrape_interval: 60s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["100.76.50.59:7100"]
        labels:
          instance: unraid-arr
          site: home

  # ── Blackbox: HTTP probes of public Caddy vhosts ──────────────────────────
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          # VPS-hosted services behind Caddy
          - https://n8n.aadd.rocks
          - https://status.aadd.rocks
          - https://portainer.aadd.rocks
          - https://vault.aadd.rocks
          - https://ntfy.aadd.rocks
          - https://git.aadd.rocks
          - https://notes.aadd.rocks
          - https://matt.aadd.rocks
          # Home services reached over Tailscale
  # (resume.aadd.rocks / storage-resume.aadd.rocks removed 2026-10-15 - stale cash routes)
          - https://photoprism.aadd.rocks
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Auth-gated public routes: a 401 proves that Caddy/the app is reachable and
  # still enforcing authentication. Do not treat auth as downtime.
  - job_name: blackbox-auth-required
    metrics_path: /probe
    params:
      module: [http_auth_required]
    static_configs:
      - targets:
          - https://dash.aadd.rocks
          - https://pdf.aadd.rocks
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ── Blackbox: internal monitoring health (container DNS, no public DNS) ───
  - job_name: blackbox-internal
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://prometheus:9090/-/ready
          - http://grafana:3000/login
          - http://homepage:3000
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ── Blackbox: ICMP ping of tailnet nodes ──────────────────────────────────
  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
          - oracle.manee-frog.ts.net     # this VPS
          - ha.manee-frog.ts.net
          - ai-server.manee-frog.ts.net
          - cash.manee-frog.ts.net
          - hapios.manee-frog.ts.net
          - un.manee-frog.ts.net
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
