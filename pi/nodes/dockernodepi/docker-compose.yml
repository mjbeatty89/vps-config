# dockernodepi role containers (declarative; applied by pi/deploy.sh)
# node_exporter is a native service on this node, so only cadvisor is managed here.
name: pi-dockernodepi

services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "0.0.0.0:8080:8080"

  # ── PXE network boot (netboot.xyz) ────────────────────────────────────────
  # TFTP :69/udp, web assets :8080, webapp UI :3000.
  # Point UniFi DHCP at it with: dhcpd_boot_server=<pi-ip>, dhcpd_boot_filename=netboot.xyz.efi
  netbootxyz:
    image: ghcr.io/netbootxyz/netbootxyz:latest
    container_name: netbootxyz
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Detroit
      - NGINX_PORT=80
      - TFTP_PORT=69
    ports:
      - "3000:3000"      # netboot.xyz webapp UI
      - "69:69/udp"      # TFTP
      - "8080:80"        # HTTP assets / kernel+initrd
    volumes:
      - ./netbootxyz/config:/config
