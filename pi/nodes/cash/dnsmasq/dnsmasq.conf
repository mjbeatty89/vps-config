# proxyDHCP for PXE. UniFi keeps handing out addresses; we only answer PXE
# clients (option 60 / client-arch), so nothing else on the VLAN is affected.
port=0
log-dhcp
dhcp-range=10.1.30.0,proxy
# Suppress router/DNS in our proxy offers - the real DHCP server owns those.
dhcp-option=3
dhcp-option=6
enable-tftp
tftp-root=/tftp

# Boot files come from pxe-service, NOT dhcp-boot: in proxy mode dnsmasq ignores
# dhcp-boot, and dhcp-match tags (option:client-arch) never survive the proxy
# tag filter, so arch-tagged dhcp-boot lines can never fire.
#
# UEFI (CSA >= 6) flow: dnsmasq answers the client's DISCOVER on port 67 with a
# redirect only (siaddr set, no filename), then hands over the boot file when
# the client asks the boot server on UDP/4011. That second socket needs
# 4011/udp open in the firewall or EFI clients stall with no boot file.
# Legacy BIOS (CSA 0) gets a real PXE menu on port 67 instead.
pxe-prompt="Press F8 for the netboot menu",3
pxe-service=x86-64_EFI,"netboot.xyz (UEFI x86-64)",netboot.xyz.efi,10.1.30.8
pxe-service=BC_EFI,"netboot.xyz (UEFI BC)",netboot.xyz.efi,10.1.30.8
pxe-service=IA32_EFI,"netboot.xyz (UEFI 32-bit)",netboot.xyz.efi,10.1.30.8
pxe-service=x86PC,"netboot.xyz (legacy BIOS)",netboot.xyz.kpxe,10.1.30.8
