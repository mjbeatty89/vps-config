# proxyDHCP for PXE. UniFi keeps handing out addresses; we only answer PXE
# clients (option 60 / client-arch), so nothing else on the VLAN is affected.
port=0
log-dhcp
dhcp-range=10.1.30.0,proxy
dhcp-option=3
dhcp-option=6
enable-tftp
tftp-root=/tftp
# x86_64 UEFI (client arch 7 and 9)
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9
dhcp-boot=tag:efi64,netboot.xyz.efi,,10.1.30.8
# legacy BIOS (client arch 0)
dhcp-match=set:bios,option:client-arch,0
dhcp-boot=tag:bios,netboot.xyz.kpxe,,10.1.30.8
