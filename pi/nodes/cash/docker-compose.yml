# cash node role containers (declarative; applied by pi/deploy.sh)
# PXE boot server for the LAN (netboot.xyz + proxyDHCP). See docs/pxe-proxmox.md.
name: pi-cash

services:
  # netboot.xyz menu / web assets / webapp (TFTP is served by dnsmasq below,
  # because Docker-NAT breaks TFTP data transfers).
  netbootxyz:
    image: ghcr.io/netbootxyz/netbootxyz:latest
    container_name: netbootxyz
    restart: unless-stopped
    environment:
      - NGINX_PORT=80
      - TFTP_PORT=69
      - PUID=1000
      - PGID=1000
      - TZ=America/Detroit
    ports:
      - "3000:3000"   # netboot.xyz webapp UI
      - "8090:80"     # web assets
    volumes:
      - /opt/netbootxyz-data/config:/config

  # proxyDHCP + TFTP. Host networking is required for real DHCP/TFTP.
  dnsmasq-pxe:
    image: dockurr/dnsmasq
    container_name: dnsmasq-pxe
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro
      - /opt/netbootxyz-data/tftp:/tftp:ro
