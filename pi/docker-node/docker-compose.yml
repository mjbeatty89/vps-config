# Spare local containers node (Raspberry Pi)
#
# This node is your "run whatever" Docker host. Everything here binds to
# 127.0.0.1 or the tailnet — nothing should be exposed on the public internet;
# put anything that needs public reach behind the VPS Caddy or a Cloudflare tunnel.
#
# Run:  cp .env.example .env && sudo docker compose up -d
name: pi-docker

services:
  # ── Example: a scratch container you can replace ──────────────────────────
  # Uncomment and edit. Keep ports on 127.0.0.1 (reach it via Tailscale Serve)
  # or on the tailnet IP if other tailnet nodes need it.
  #
  # whoami:
  #   image: traefik/whoami
  #   container_name: whoami
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:8081:80"

  # ── Example: local Portainer agent (manage this Pi from the VPS Portainer) ─
  # portainer-agent:
  #   image: portainer/agent:latest
  #   container_name: portainer-agent
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:9001:9001"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - /var/lib/docker/volumes:/var/lib/docker/volumes

  # ── Placeholder so `compose up` is valid before you add services ──────────
  placeholder:
    image: hello-world
    container_name: pi-docker-placeholder
    restart: "no"
