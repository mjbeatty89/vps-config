apiVersion: v1
kind: ResourceQuota
metadata:
  name: homelab-quota
  namespace: homelab
  labels:
    app.kubernetes.io/part-of: homelab
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 8Gi
    limits.cpu: "4"
    limits.memory: 16Gi
    pods: "20"
    services: "10"
    persistentvolumeclaims: "4"
    requests.storage: 20Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: homelab-limits
  namespace: homelab
  labels:
    app.kubernetes.io/part-of: homelab
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      max:
        cpu: "2"
        memory: 4Gi
