# Unbound — local recursive resolver for AdGuard Home (Raspberry Pi 4)
# Listens only on loopback:5335; AdGuard forwards to it as the sole upstream.
server:
    verbosity: 1
    interface: 127.0.0.1
    port: 5335
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    do-daemonize: no

    access-control: 127.0.0.0/8 allow
    access-control: ::1 allow
    # Drop everything else (adguard talks to us on loopback only)
    access-control: 0.0.0.0/0 refuse

    # Privacy / hardening
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: yes
    use-caps-for-id: no
    qname-minimisation: yes
    aggressive-nsec: yes
    edns-buffer-size: 1232
    prefetch: yes
    prefetch-key: yes
    rrset-roundrobin: yes
    minimal-responses: yes

    # Don't leak private ranges to the public internet
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10

    # Caching
    cache-min-ttl: 300
    cache-max-ttl: 86400

    # Threads / buffers (Pi 4: 4 cores)
    num-threads: 2
    so-rcvbuf: 1m
    msg-cache-size: 32m
    rrset-cache-size: 64m

    # DNSSEC validation (unbound ships built-in root trust anchor via auto-trust-anchor-file)
    val-log-level: 2
    # Uncomment if you want to manage the trust anchor explicitly:
    # auto-trust-anchor-file: "/opt/unbound/etc/unbound/root.key"

    tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"

remote-control:
    control-enable: no

# Forward zones are intentionally absent — this is a full recursive resolver.
